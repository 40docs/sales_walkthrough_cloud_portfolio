image:
  repository: ghcr.io/40docs/sales_walkthrough_cloud_portfolio
  tag: ""
  pullPolicy: IfNotPresent

replicaCount: 2

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: nginx
  host: walkthrough.example.com
  tls:
    enabled: true
    secretName: walkthrough-tls
    issuer: letsencrypt-prod
  rateLimit:
    rpm: 600
    connections: 20
  # Optional IP allowlist for /admin/* — leave empty to allow from anywhere.
  # Cleanest defense: lock admin access to corporate egress IPs even though
  # the portal is password-protected.
  adminAllowCIDRs: []
  # e.g. ["10.0.0.0/8", "203.0.113.42/32"]

publicUrl: "https://walkthrough.example.com"

secret:
  create: true
  jwtPrivateKey: ""    # base64 ed25519 seed (openssl rand -base64 32)
  adminPassword: ""    # human password for the /admin browser portal
  adminToken: ""       # optional bearer token for CLI scripts (e.g. CI-driven mint)
  ipSalt: "change-me"

postgres:
  cnpg:
    enabled: true
    instances: 2
    storage:
      size: 5Gi
      storageClass: ""
  externalUrl: ""

resources:
  limits:
    cpu: 200m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

# Pod hardening
podSecurityContext:
  fsGroup: 65532
  runAsNonRoot: true
  runAsUser: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532

# NetworkPolicy locks the pod to: ingress from the ingress controller only,
# egress to the CNPG Postgres service only (plus DNS).
networkPolicy:
  enabled: true
  ingressControllerNamespace: ingress-nginx
  ingressControllerPodLabels:
    app.kubernetes.io/name: ingress-nginx
  dnsNamespace: kube-system

# Keep at least one replica available during voluntary disruptions.
podDisruptionBudget:
  enabled: true
  minAvailable: 1

nodeSelector: {}
tolerations: []
affinity: {}
