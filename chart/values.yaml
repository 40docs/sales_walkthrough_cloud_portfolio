image:
  repository: ghcr.io/40docs/sales_walkthrough_cloud_portfolio
  tag: ""               # default to .Chart.AppVersion if empty
  pullPolicy: IfNotPresent

replicaCount: 2

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: nginx
  host: walkthrough.example.com
  tls:
    enabled: true
    secretName: walkthrough-tls
    issuer: letsencrypt-prod   # cert-manager ClusterIssuer
  rateLimit:
    rpm: 600                   # per client IP
    connections: 20

# Public base URL injected into the mint response for QR convenience.
publicUrl: "https://walkthrough.example.com"

# Secrets — supply via --set / sealed-secrets / external-secrets in real envs.
# These values are templated into a Secret if `secret.create` is true.
secret:
  create: true
  jwtPrivateKey: ""    # base64 ed25519 seed (openssl rand -base64 32)
  adminToken: ""       # opaque string for /admin/mint
  ipSalt: "change-me"

postgres:
  # CNPG operator must be installed in the cluster.
  cnpg:
    enabled: true
    instances: 2
    storage:
      size: 5Gi
      storageClass: ""
  # External Postgres alternative — set cnpg.enabled=false and supply this:
  externalUrl: ""

resources:
  limits:
    cpu: 200m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

podSecurityContext:
  fsGroup: 65532
  runAsNonRoot: true
  runAsUser: 65532

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  readOnlyRootFilesystem: true

nodeSelector: {}
tolerations: []
affinity: {}
