{{- if .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "walkthrough.fullname" . }}-secrets
  labels: {{- include "walkthrough.labels" . | nindent 4 }}
type: Opaque
stringData:
  jwtPrivateKey: {{ required "secret.jwtPrivateKey is required (base64 ed25519 seed)" .Values.secret.jwtPrivateKey | quote }}
  adminPassword: {{ required "secret.adminPassword is required" .Values.secret.adminPassword | quote }}
  adminToken: {{ .Values.secret.adminToken | quote }}
  ipSalt: {{ .Values.secret.ipSalt | quote }}
{{- end }}
